deploymentName: orders-deployment
configMapName: orders-configmap

backend:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  image:
    repository: dev.luciano/order.service
    tag: "1.0.0"

#hpa:
#  minReplicas: 1
#  maxReplicas: 1
otel_enabled: false

global:
  openTelemetryJavaAgent: "-javaagent:/app/libs/opentelemetry-javaagent-2.11.0.jar"
  otelExporterEndPoint: http://tempo-grafana-tempo-distributor:4318
  otelMetricsExporter: none
  otelLogsExporter: none