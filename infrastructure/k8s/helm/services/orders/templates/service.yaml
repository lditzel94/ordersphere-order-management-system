apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-svc
  namespace: default
  labels:
    app: orders
spec:
  selector:
    app: {{ .Chart.Name }}
  type: {{ .Values.backend.service.type }}
  ports:
    - name: order-service-port
      protocol: TCP
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}